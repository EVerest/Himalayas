name: Record a pointer move

# Receives the pointer-moved dispatch from EVerest's move-pointers job and
# appends to the append-only log. This half is why the log can be trusted: the
# repository that moves the branch does not write the log directly, so a
# malformed or undeclared move is refused here rather than silently recorded.
#
# EVERY PAYLOAD FIELD GOES THROUGH env:, AND NOTHING IS INTERPOLATED INTO A
# SHELL COMMAND. The four fields were `${{ github.event.client_payload.* }}`
# inside `run:` blocks, which is command substitution in a job that needs a
# push credential and therefore cannot use `persist-credentials: false` - so an
# injected command could have read the token straight out of .git/config.
# `env:` puts the value in the process environment, where the shell never parses
# it. Do not put a payload field back into a run: line.

on:
  repository_dispatch:
    types: [pointer-moved]

permissions:
  contents: write

concurrency:
  group: pointer-log
  cancel-in-progress: false     # appends must not interleave

jobs:
  record:
    runs-on: ubuntu-24.04
    # This job pushes, so the checkout keeps its credential. That is the reason
    # the injection above mattered, and the reason it must stay fixed.
    env:
      POINTER: ${{ github.event.client_payload.pointer }}
      TRACKS: ${{ github.event.client_payload.tracks }}
      SHA: ${{ github.event.client_payload.sha }}
      MOVED_AT: ${{ github.event.client_payload.moved_at }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Append the move
        run: |
          set -euo pipefail
          python scripts/record_pointer_move.py \
            --pointer  "$POINTER" \
            --tracks   "$TRACKS" \
            --sha      "$SHA" \
            --moved-at "$MOVED_AT"

      - name: Commit, if it changed
        run: |
          set -euo pipefail
          if git diff --quiet -- pointers.json; then
            echo "no change - already logged"
            exit 0
          fi
          git config user.name  "everest-himalayas[bot]"
          git config user.email "noreply@everest.github.io"
          git add pointers.json
          # -F -, so the message is read from stdin rather than being part of the
          # command line. record_pointer_move.py has already rejected anything
          # that is not a declared pointer and a 40-character SHA, so these two
          # are constrained by the time they get here - but the shape of the
          # command should not depend on that.
          printf 'pointers: %s -> %s\n' "$POINTER" "$SHA" | git commit -F -
          git push

      - name: Verify the pointers still agree
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/verify_pointers.py --repo EVerest/EVerest
